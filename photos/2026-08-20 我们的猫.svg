<svg xmlns="http://www.w3.org/2000/svg" width="920" height="1240" viewBox="0 0 920 1240">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a6a48"/>
      <stop offset="0.6" stop-color="#c89a62"/>
      <stop offset="1" stop-color="#4c3826"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.62" cy="0.3" r="0.42">
      <stop offset="0" stop-color="#ffe3ae" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ffe3ae" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="0.5" cy="0.45" r="0.78">
      <stop offset="0.6" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#241407" stop-opacity="0.5"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.07"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="920" height="1240" fill="url(#sky)"/>
  <rect width="920" height="1240" fill="url(#lamp)"/>
  <ellipse cx="460" cy="1080" rx="330" ry="150" fill="#2c1d12" opacity="0.55"/>
  <rect y="1090" width="920" height="150" fill="#24160c" opacity="0.6"/>
  <circle cx="300" cy="300" r="46" fill="#ffe3ae" opacity="0.18"/>
  <circle cx="760" cy="560" r="30" fill="#ffe3ae" opacity="0.14"/>
  <rect width="920" height="1240" fill="url(#vig)"/>
  <rect width="920" height="1240" filter="url(#grain)"/>
</svg>
