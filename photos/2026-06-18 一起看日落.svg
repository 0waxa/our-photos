<svg xmlns="http://www.w3.org/2000/svg" width="920" height="1240" viewBox="0 0 920 1240">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c2a4a"/>
      <stop offset="0.5" stop-color="#7a3b52"/>
      <stop offset="0.82" stop-color="#d96a3b"/>
      <stop offset="1" stop-color="#5c2218"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.82" r="0.34">
      <stop offset="0" stop-color="#ffe8b0" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#ffb45e" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffb45e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="0.5" cy="0.45" r="0.78">
      <stop offset="0.6" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#170b12" stop-opacity="0.52"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.07"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="920" height="1240" fill="url(#sky)"/>
  <rect width="920" height="1240" fill="url(#sun)"/>
  <ellipse cx="460" cy="1030" rx="300" ry="26" fill="#3a1c14" opacity="0.55"/>
  <rect y="1030" width="920" height="210" fill="#241310" opacity="0.5"/>
  <rect width="920" height="1240" fill="url(#vig)"/>
  <rect width="920" height="1240" filter="url(#grain)"/>
</svg>
