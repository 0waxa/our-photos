<svg xmlns="http://www.w3.org/2000/svg" width="920" height="1240" viewBox="0 0 920 1240">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9a3ad"/>
      <stop offset="0.55" stop-color="#e8c9c4"/>
      <stop offset="1" stop-color="#8a6a7e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.42" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#fff1e4" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#fff1e4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="0.5" cy="0.46" r="0.78">
      <stop offset="0.6" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#3a2330" stop-opacity="0.42"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.07"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="920" height="1240" fill="url(#sky)"/>
  <rect width="920" height="1240" fill="url(#glow)"/>
  <circle cx="240" cy="300" r="70" fill="#fff4e8" opacity="0.3"/>
  <circle cx="700" cy="420" r="96" fill="#fff4e8" opacity="0.2"/>
  <circle cx="480" cy="620" r="50" fill="#fff4e8" opacity="0.22"/>
  <circle cx="330" cy="760" r="38" fill="#fff4e8" opacity="0.16"/>
  <circle cx="760" cy="820" r="30" fill="#fff4e8" opacity="0.18"/>
  <rect width="920" height="1240" fill="url(#vig)"/>
  <rect width="920" height="1240" filter="url(#grain)"/>
</svg>
