<svg xmlns="http://www.w3.org/2000/svg" width="920" height="1240" viewBox="0 0 920 1240">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6e4632"/>
      <stop offset="0.55" stop-color="#a3673f"/>
      <stop offset="1" stop-color="#3d2a20"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#ffd9a0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffd9a0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="0.5" cy="0.46" r="0.78">
      <stop offset="0.6" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#1c120b" stop-opacity="0.5"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.07"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="920" height="1240" fill="url(#sky)"/>
  <rect width="920" height="1240" fill="url(#glow)"/>
  <circle cx="300" cy="330" r="60" fill="#ffe9c4" opacity="0.28"/>
  <circle cx="650" cy="260" r="90" fill="#ffd9a0" opacity="0.16"/>
  <circle cx="720" cy="520" r="46" fill="#ffe9c4" opacity="0.2"/>
  <circle cx="220" cy="640" r="34" fill="#ffe9c4" opacity="0.14"/>
  <rect width="920" height="1240" fill="url(#vig)"/>
  <rect width="920" height="1240" filter="url(#grain)"/>
</svg>
